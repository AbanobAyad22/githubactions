name: add user
description: File a bug report to help us improve
title: "[user name]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you expected to happen and what actually occurred.
      placeholder: what usser you want to add in the Role
    validations:
      required: true
