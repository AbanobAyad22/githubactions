name: AWS Role Access Request
description: Request permission for an IAM user to assume an AWS role
title: "[AWS Access Request] "
labels:
  - access-request
body:
  - type: markdown
    attributes:
      value: |
        ## AWS Access Request
        Select the AWS role and provide the AWS IAM username that should be allowed to assume it.
        Access remains in place until an administrator removes it.

  - type: dropdown
    id: aws_role
    attributes:
      label: Select AWS Role
      description: Which AWS IAM role should the selected IAM user be allowed to assume?
      options:
        - AdminAccess
        - EC2FullAccess
    validations:
      required: true

  - type: input
    id: iam_username
    attributes:
      label: IAM Username
      description: Enter the exact AWS IAM username to grant access to.
      placeholder: example-user
    validations:
      required: true

  - type: textarea
    id: justification
    attributes:
      label: Business Justification
      description: Explain why you need this access.
      placeholder: Describe your requirement...
    validations:
      required: true

