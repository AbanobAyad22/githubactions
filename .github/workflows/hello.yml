on: 
    # push:
    #     branches:
    #         - main
    # issues:
    #     types:
    #         - opened
    workflow_dispatch:
        inputs:
            environment:
                description: "choose an environment"
                required: true
                type: choice
                options:
                    - dev
                    - test

jobs: 
    print-hello:
         runs-on: ubuntu-latest
         
         steps: 
            - name: print hello 
              run: echo "welcome to your first workflow"

            - name: print env 
              run: echo "{{ inputs.environment }}"              


    print-welcome:
            runs-on: ubuntu-latest
            needs: print-hello
            steps: 
                - name: print hi 
                  run: echo "hi"              


    print-hi:
            runs-on: ubuntu-latest
            needs: print-hello
            steps: 
                - name: print hi 
                  run: echo "welcome"                                