
name: GitHub AWS Access

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  aws-access:
    runs-on: ubuntu-latest

    steps:

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          TOKEN="$TOKEN" python3 - <<'PY'
          import os, json, base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print(json.dumps({
              "sub": claims.get("sub"),
              "aud": claims.get("aud"),
              "ref": claims.get("ref"),
              "repository": claims.get("repository"),
              "repository_owner": claims.get("repository_owner"),
              "environment": claims.get("environment"),
          }, indent=2))
          PY
    
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          role-to-assume: arn:aws:iam::110844250998:role/GitHubFullAccessRole
          aws-region: eu-central-1
          role-session-name: GitHubActionsSession

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity

      - name: List S3 buckets
        run: |
          aws s3 ls
