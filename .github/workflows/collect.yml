name: AWS Role Request Notification

on:
  issues:
    types: [opened]

permissions:
  id-token: write
  contents: read
  issues: read

jobs:
  notify-requester:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          role-to-assume: arn:aws:iam::110844250998:role/GitHubFullAccessRole
          aws-region: eu-central-1
          role-session-name: GitHubActionsSession

      - name: Verify AWS access
        run: |
          aws sts get-caller-identity      
      - name: Extract role and username
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          ROLE=$(echo "$ISSUE_BODY" | sed -n '/### Select AWS Role/{n;n;p;}')
          IAM_USERNAME=$(echo "$ISSUE_BODY" | sed -n '/### IAM Username/{n;n;p;}')
      
          echo "role=$ROLE" >> "$GITHUB_OUTPUT"
          echo "email=$IAM_USERNAME" >> "$GITHUB_OUTPUT"
          echo "username=$IAM_USERNAME" >> "$GITHUB_OUTPUT"
      
          echo "Selected role: $ROLE"
          echo "IAM username: $IAM_USERNAME"

      - name: Allow IAM user to assume selected role
        env:
          IAM_USERNAME: ${{ steps.request.outputs.email }}
          Role: ${{ steps.request.outputs.role }}
        shell: bash
        run: |
          POLICY_ARN="arn:aws:iam::110844250998:policy/Assume${POLICY_NAME}"
          echo "policy= $POLICY_ARN"
          set -euo pipefail
          aws iam attach-user-policy \
            --user-name "$IAM_USERNAME" \
            --policy-arn "$POLICY_ARN"

      - name: Summarize grant
        env:
          IAM_USERNAME: ${{ steps.request.outputs.username }}
          ROLE: ${{ steps.request.outputs.role }}
        run: |
          {
            echo "## AWS role access granted"
            echo ""
            echo "- IAM user: \`$IAM_USERNAME\`"
            echo "- Role they can assume: \`$ROLE\`"
          } >> "$GITHUB_STEP_SUMMARY"          